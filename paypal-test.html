<!DOCTYPE html>
<html lang="el">
<meta charset="UTF-8">
<h2>PayPal Sandbox - 40€</h2>
<button onclick="test()">Δοκιμή PayPal</button>
<pre id="result"></pre>
<script>
async function test(){
  const r = await fetch('/api/paypal',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'create_test_order'})
  });
  const d = await r.json();
  document.getElementById('result').textContent =
    JSON.stringify(d,null,2);
}
</script>
</html>
